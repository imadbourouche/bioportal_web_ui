name: Push current branch to GitLab

on:
  push:
    branches:
      - main
      - stage
      - test
      - gitlab_ci_cd

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4  # shallow clone is fine because we only need the current branch

      - name: Push current branch to GitLab
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
          BRANCH: ${{ github.ref_name }}  # e.g. main, stage, test
        run: |
          git config --global user.name "${GITLAB_USERNAME}"
          git config --global user.email "${GITLAB_USERNAME}@users.noreply.gitlab.com"

          git remote add gitlab https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_URL#https://}/${GITLAB_REPO}.git

          git push -u gitlab HEAD:${BRANCH}
